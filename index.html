<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プリキュア 2択で決めるMy Best 9</title>
  <style>
    :root {
      --bg: #fff0f5;
      --accent: #ff69b4;
      --card-bg: #ffffff;
      --text: #333;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: var(--accent); margin-bottom: 5px; text-align: center; font-size: 1.5rem; }
    p.sub { color: #666; font-size: 0.85rem; margin-bottom: 15px; text-align: center; }

    /* 1. 予選画面 */
    .yosen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 800px;
      max-height: 60vh;
      overflow-y: auto;
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    .item-card {
      border: 2px solid #ddd;
      border-radius: 8px;
      padding: 5px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }
    .item-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 4px;
      pointer-events: none;
    }
    .item-card input { display: none; }
    .item-card.selected {
      border-color: var(--accent);
      background: #ffe6f2;
    }
    .item-name { font-size: 0.75rem; font-weight: bold; margin-top: 4px; }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    /* 2. 2択対戦画面 */
    #match-screen { display: none; width: 100%; max-width: 500px; text-align: center; }
    .match-container {
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }
    .match-card {
      flex: 1;
      background: #fff;
      border: 3px solid #ffb6c1;
      border-radius: 15px;
      padding: 15px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.1s, border-color 0.2s;
    }
    .match-card:hover {
      transform: scale(1.03);
      border-color: var(--accent);
    }
    .match-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
    }
    .match-name {
      font-size: 1rem;
      font-weight: bold;
      margin-top: 10px;
    }

    /* 3. 結果画面 */
    #result-screen { display: none; width: 100%; max-width: 600px; }
    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .result-card {
      background: #fff;
      border: 3px solid #ffb6c1;
      border-radius: 12px;
      padding: 8px;
      position: relative;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      text-align: center;
    }
    .result-card.top3 { border-color: gold; background: #fffdf0; }
    .badge {
      position: absolute;
      top: -8px; left: -8px;
      background: var(--accent);
      color: #fff;
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .result-card.top3 .badge { background: gold; color: #333; }
    .result-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- 1. 予選画面 -->
  <div id="yosen-screen">
    <h1>予選：好きなメンバーを選ぼう</h1>
    <p class="sub">選択中: <span id="count">0</span> / 91人 (14人以上選んでください)</p>

    <div class="yosen-grid" id="yosen-list"></div>

    <div style="text-align: center;">
      <button class="btn" id="go-match-btn" disabled onclick="startMatchPhase()">2択対戦をはじめる！</button>
    </div>
  </div>

  <!-- 2. 2択対戦画面 -->
  <div id="match-screen">
    <h1>好きな方を選んでね！</h1>
    <p class="sub">第 <span id="match-count">1</span> 判定</p>

    <div class="match-container">
      <div class="match-card" onclick="choose(0)">
        <img id="img-left" src="" alt="">
        <div class="match-name" id="name-left"></div>
      </div>
      <div class="match-card" onclick="choose(1)">
        <img id="img-right" src="" alt="">
        <div class="match-name" id="name-right"></div>
      </div>
    </div>
  </div>

  <!-- 3. 結果発表画面 -->
  <div id="result-screen">
    <h1>あなたのお気に入り TOP 9</h1>
    <p class="sub">対戦結果から算出されたランキングです！</p>

    <div class="result-grid" id="result-list"></div>

    <div style="text-align: center;">
      <button class="btn" onclick="location.reload()">もう一度あそぶ</button>
    </div>
  </div>

  <script>
    // 01.jpg ～ 91.jpg の自動読み込み設定
    const precureList = [];
    for (let i = 1; i <= 91; i++) {
      const numStr = String(i).padStart(2, '0'); // 1 -> "01", 9 -> "09", 10 -> "10"
      precureList.push({
        id: i,
        name: `No.${numStr}`,
        img: `${numStr}.jpg`
      });
    }

    const yosenListEl = document.getElementById('yosen-list');
    const countEl = document.getElementById('count');
    const btnEl = document.getElementById('go-match-btn');
    let selectedIds = [];

    // 予選画面の表示
    precureList.forEach(p => {
      const card = document.createElement('label');
      card.className = 'item-card';
      card.innerHTML = `
        <input type="checkbox" value="${p.id}" onchange="toggleSelect(this, ${p.id})">
        <img src="${p.img}" alt="${p.name}">
        <div class="item-name">${p.name}</div>
      `;
      yosenListEl.appendChild(card);
    });

    function toggleSelect(input, id) {
      const card = input.parentElement;
      if (input.checked) {
        selectedIds.push(id);
        card.classList.add('selected');
      } else {
        selectedIds = selectedIds.filter(i => i !== id);
        card.classList.remove('selected');
      }
      countEl.textContent = selectedIds.length;
      btnEl.disabled = selectedIds.length < 14;
    }

    // マージソート対戦処理
    let sortTasks = [];
    let currentTask = null;
    let matchStep = 0;

    function startMatchPhase() {
      document.getElementById('yosen-screen').style.display = 'none';
      document.getElementById('match-screen').style.display = 'block';

      const finalists = precureList.filter(p => selectedIds.includes(p.id));
      const initialArrays = finalists.map(item => [item]);
      
      buildMergeTasks(initialArrays);
      nextMatch();
    }

    function buildMergeTasks(arrays) {
      if (arrays.length <= 1) {
        showResult(arrays[0] || []);
        return;
      }

      let nextLevelArrays = [];
      for (let i = 0; i < arrays.length; i += 2) {
        if (i + 1 < arrays.length) {
          sortTasks.push({
            left: arrays[i],
            right: arrays[i + 1],
            merged: [],
            leftIdx: 0,
            rightIdx: 0,
            onComplete: (resultArray) => {
              nextLevelArrays.push(resultArray);
            }
          });
        } else {
          nextLevelArrays.push(arrays[i]);
        }
      }

      sortTasks.push({
        isLevelEnd: true,
        nextArrays: nextLevelArrays
      });
    }

    function nextMatch() {
      if (sortTasks.length === 0) return;

      currentTask = sortTasks[0];

      if (currentTask.isLevelEnd) {
        const nextArrays = currentTask.nextArrays;
        sortTasks.shift();
        buildMergeTasks(nextArrays);
        nextMatch();
        return;
      }

      if (currentTask.leftIdx >= currentTask.left.length) {
        currentTask.merged.push(...currentTask.right.slice(currentTask.rightIdx));
        currentTask.onComplete(currentTask.merged);
        sortTasks.shift();
        nextMatch();
        return;
      }
      if (currentTask.rightIdx >= currentTask.right.length) {
        currentTask.merged.push(...currentTask.left.slice(currentTask.leftIdx));
        currentTask.onComplete(currentTask.merged);
        sortTasks.shift();
        nextMatch();
        return;
      }

      matchStep++;
      document.getElementById('match-count').textContent = matchStep;

      const itemLeft = currentTask.left[currentTask.leftIdx];
      const itemRight = currentTask.right[currentTask.rightIdx];

      document.getElementById('img-left').src = itemLeft.img;
      document.getElementById('name-left').textContent = itemLeft.name;
      document.getElementById('img-right').src = itemRight.img;
      document.getElementById('name-right').textContent = itemRight.name;
    }

    function choose(winner) {
      if (winner === 0) {
        currentTask.merged.push(currentTask.left[currentTask.leftIdx]);
        currentTask.leftIdx++;
      } else {
        currentTask.merged.push(currentTask.right[currentTask.rightIdx]);
        currentTask.rightIdx++;
      }
      nextMatch();
    }

    function showResult(sortedList) {
      document.getElementById('match-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'block';

      const resultListEl = document.getElementById('result-list');
      resultListEl.innerHTML = '';

      const top9 = sortedList.slice(0, 9);

      top9.forEach((p, index) => {
        const card = document.createElement('div');
        card.className = `result-card ${index < 3 ? 'top3' : ''}`;
        card.innerHTML = `
          <div class="badge">${index + 1}</div>
          <img src="${p.img}" alt="${p.name}">
          <div class="item-name">${p.name}</div>
        `;
        resultListEl.appendChild(card);
      });
    }
  </script>
</body>
</html>
