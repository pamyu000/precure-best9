}
function cardHTML(c,side){
  const initials=c.cure.replace("キュア","").slice(0,2);
  return `<div class="portrait"><span class="tag">${side}</span><img src="${c.image}" alt="${c.cure}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fallback">${initials}</span></div><div class="info"><div class="cure">${c.cure}</div><div class="real">${c.name}</div><div class="series">${c.series}</div></div>`;
}
function nextPair(){
  if(current>=totalGames){showResult();return;}
  const [a,b]=pickPair(); players._current=[a,b];
  document.getElementById("left").innerHTML=cardHTML(a,"LEFT");
  document.getElementById("right").innerHTML=cardHTML(b,"RIGHT");
  document.getElementById("count").textContent=`${current+1} / ${totalGames}`;
  document.getElementById("bar").style.width=`${current/totalGames*100}%`;
}
function choose(side){
  const [a,b]=players._current;
  const winner=side==="left"?a:b, loser=side==="left"?b:a;
  history.push({a,b, winner, loser, beforeA:a.score,beforeB:b.score});
  updateElo(winner,loser); current++; nextPair();
}
function undoLast(){
  const h=history.pop(); if(!h)return;
  h.a.score=h.beforeA; h.b.score=h.beforeB; h.a.wins-=(h.winner===h.a?1:0); h.b.wins-=(h.winner===h.b?1:0); h.a.games--; h.b.games--;
  current--; pairHistory.pop(); nextPair();
}
function startGame(n){
  totalGames=n; current=0; history=[]; pairHistory=[]; players=clonePlayers(); gameStarted=true;
  document.getElementById("start").classList.add("hidden"); document.getElementById("result").classList.add("hidden"); document.getElementById("game").classList.remove("hidden"); nextPair();
}
function showResult(){
  document.getElementById("bar").style.width="100%";
  const sorted=[...players].sort((a,b)=>b.score-a.score);
  document.getElementById("game").classList.add("hidden"); document.getElementById("result").classList.remove("hidden");
  document.getElementById("resultSub").textContent=`${totalGames}回の「好き！」から作った、あなた専用ランキング`;
  document.getElementById("best9").innerHTML=sorted.slice(0,9).map((c,i)=>`<div class="rank"><div class="mini"><span class="ranknum">${i+1}</span><img src="${c.image}" alt="${c.cure}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fallback">${c.cure.replace("キュア","").slice(0,2)}</span></div><div class="body"><div class="cure">${c.cure}</div><div class="real">${c.name}</div><div class="score">Elo ${Math.round(c.score)}</div></div></div>`).join("");
  document.getElementById("allRank").innerHTML=sorted.map((c,i)=>`<div class="rank-row"><b>${i+1}</b><span>${c.cure} <small>${c.name}</small></span><strong>${Math.round(c.score)}</strong></div>`).join("");
}
function resetGame(){
  document.getElementById("game").classList.add("hidden"); document.getElementById("result").classList.add("hidden"); document.getElementById("start").classList.remove("hidden");
}
document.getElementById("left").addEventListener("click",()=>choose("left"));
document.getElementById("right").addEventListener("click",()=>choose("right"));
</script>
</body>
